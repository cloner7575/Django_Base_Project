{% if href %}
  <a class="btn {% if variant == 'ghost' %}btn--ghost{% elif variant == 'soft' %}btn--soft{% else %}btn--primary{% endif %}{% if size == 'sm' %} btn--sm{% endif %}" href="{{ href }}">{{ text }}</a>
{% else %}
  <button class="btn {% if variant == 'ghost' %}btn--ghost{% elif variant == 'soft' %}btn--soft{% else %}btn--primary{% endif %}{% if size == 'sm' %} btn--sm{% endif %}" type="{{ type|default:'submit' }}">{{ text }}</button>
{% endif %}
